app-id: com.voxdsp.Tuxocide
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: tuxocide
rename-icon: tuxocide
rename-desktop-file: tuxocide.desktop
rename-appdata-file: tuxocide.appdata.xml
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
modules:
  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_WAYLAND=1
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        # The latest commit from the repository
        commit: fdd14e65b1c29e4e6df875fb5669ec00d6793531
  - name: tuxocide
    buildsystem: simple
    build-commands:
      - cc main.c glad_gl.c -I inc -Ofast -L/app/lib -lglfw -lm -o tuxocide
      - install -Dm 0755 tuxocide -t ${FLATPAK_DEST}/bin
      - install -Dm 0644 tuxocide.appdata.xml -t ${FLATPAK_DEST}/share/metainfo/
      - install -Dm 0644 snap/gui/tuxocide.desktop -t ${FLATPAK_DEST}/share/applications/
      - install -Dm 0644 snap/gui/tuxocide.png -t ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/
    sources:
      - type: git
        url: https://github.com/mrbid/Tuxocide.git
        # The latest commit from the repository
        commit: 8887bfb09f7371e564e18ef474bacc1a4039abc6
      - type: file
        path: tuxocide.appdata.xml
